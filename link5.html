<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LinkHub V6 - Nihal</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --glow-color: #00f0ff;
      --bg-color: #0f0f0f;
      --card-bg: rgba(255, 255, 255, 0.05);
    }

    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background: var(--bg-color);
      color: white;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 20px;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.7rem;
      background: linear-gradient(90deg, #00f0ff, #ff00f7, #00f0ff);
      background-size: 300%;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: moveGradient 4s linear infinite;
      margin-bottom: 40px;
    }

    @keyframes moveGradient {
      0% {background-position: 0%;}
      100% {background-position: 200%;}
    }

    .links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 30px;
      width: 100%;
      max-width: 1000px;
      z-index: 2;
    }

    .link {
      padding: 20px 25px;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: 600;
      color: #fff;
      box-shadow: 0 0 20px rgba(0,255,255,0.15);
      cursor: pointer;
      transition: 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .link::before {
      content: '';
      position: absolute;
      top: -100%;
      left: -100%;
      width: 300%;
      height: 300%;
      background: radial-gradient(circle, rgba(0,255,255,0.2) 0%, transparent 80%);
      transform: rotate(45deg);
      animation: shine 4s linear infinite;
      opacity: 0.3;
    }

    @keyframes shine {
      0% {transform: translate(-100%, -100%) rotate(45deg);}
      100% {transform: translate(100%, 100%) rotate(45deg);}
    }

    .link:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(0,255,255,0.3);
    }

    .copied {
      position: fixed;
      top: 20px;
      background: var(--glow-color);
      color: #000;
      padding: 10px 25px;
      border-radius: 30px;
      font-weight: bold;
      animation: fadeOut 2s forwards ease;
      z-index: 3;
    }

    @keyframes fadeOut {
      0% { opacity: 1; }
      90% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-30px); }
    }

    .bg-circles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .bg-circles span {
      position: absolute;
      display: block;
      width: 60px;
      height: 60px;
      background: rgba(0,255,255,0.1);
      border-radius: 50%;
      animation: floatCircle 20s linear infinite;
    }

    .bg-circles span:nth-child(1) {
      top: 20%;
      left: 15%;
      width: 80px;
      height: 80px;
      animation-delay: 0s;
    }

    .bg-circles span:nth-child(2) {
      top: 60%;
      left: 70%;
      width: 100px;
      height: 100px;
      animation-delay: 4s;
    }

    .bg-circles span:nth-child(3) {
      top: 40%;
      left: 40%;
      animation-delay: 8s;
    }

    .bg-circles span:nth-child(4) {
      top: 75%;
      left: 25%;
      width: 70px;
      height: 70px;
      animation-delay: 12s;
    }

    .bg-circles span:nth-child(5) {
      top: 10%;
      left: 80%;
      width: 90px;
      height: 90px;
      animation-delay: 16s;
    }

    @keyframes floatCircle {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-100vh) rotate(360deg); }
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 1.7rem;
        text-align: center;
      }
      .link {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="bg-circles">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <h1>🚀 Nihal's Holographic Hub</h1>

  <div class="links">
    <div class="link" data-url="https://www.linkedin.com/">LinkedIn</div>
    <div class="link" data-url="https://github.com/">GitHub</div>
    <div class="link" data-url="https://www.instagram.com/">Instagram</div>
    <div class="link" data-url="https://www.fiverr.com/">Fiverr</div>
    <div class="link" data-url="https://www.facebook.com/">Facebook</div>
  </div>

  <script>
    const links = document.querySelectorAll('.link');

    links.forEach(link => {
      link.addEventListener('click', () => {
        const url = link.getAttribute('data-url');
        navigator.clipboard.writeText(url);
        showCopied(url);
      });
    });

    function showCopied(text) {
      const div = document.createElement('div');
      div.className = 'copied';
      div.innerText = `Copied: ${text}`;
      document.body.appendChild(div);
      setTimeout(() => {
        div.remove();
      }, 2000);
    }
  </script>

</body>
</html>
