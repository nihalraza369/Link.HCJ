<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nihal's Links V2</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      backdrop-filter: blur(20px);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 25px;
      padding: 40px;
      width: 320px;
      text-align: center;
      color: #fff;
      animation: slideIn 1s ease-in-out;
      box-shadow: 0 0 40px rgba(0, 255, 255, 0.1);
    }

    .profile-pic {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #00ffee;
      margin-bottom: 15px;
      transition: transform 0.4s;
    }

    .profile-pic:hover {
      transform: scale(1.1);
    }

    h2 {
      margin-bottom: 6px;
      font-size: 22px;
      font-weight: 600;
    }

    p {
      font-size: 14px;
      color: #ddd;
      margin-bottom: 20px;
    }

    .links a {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      margin: 12px 0;
      padding: 12px;
      border-radius: 50px;
      color: #00ffee;
      text-decoration: none;
      transition: all 0.3s ease;
      font-weight: 500;
    }

    .links a i {
      margin-right: 10px;
    }

    .links a:hover {
      background-color: #00ffee;
      color: #000;
      transform: scale(1.05);
      box-shadow: 0 0 15px #00ffeea6;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="ChatGPT Image Apr 19, 2025, 02_57_24 PM - Shortcut.lnk" alt="Nihal" class="profile-pic"/>
    <h2>Nihal Raza</h2>
    <p>AI Dev | Frontend | Mentor | Freelancer</p>

    <div class="links">
      <a href="https://linkedin.com" target="_blank"><i class="fab fa-linkedin"></i> LinkedIn</a>
      <a href="https://github.com" target="_blank"><i class="fab fa-github"></i> GitHub</a>
      <a href="https://instagram.com" target="_blank"><i class="fab fa-instagram"></i> Instagram</a>
      <a href="https://facebook.com" target="_blank"><i class="fab fa-facebook"></i> Facebook</a>
      <a href="https://fiverr.com" target="_blank"><i class="fas fa-briefcase"></i> Fiverr</a>
      <a href="https://your-portfolio.com" target="_blank"><i class="fas fa-globe"></i> Portfolio</a>
    </div>
  </div>

</body>
</html>
